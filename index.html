<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FocusNest — Focus Timer</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="app">
  <header><p class="eyebrow">MAKE SPACE FOR GOOD WORK</p><h1>Focus<span>Nest</span></h1><p>One task at a time.</p></header>
  <section class="card">
    <nav><button class="mode active" data-mode="focus">Focus</button><button class="mode" data-mode="break">Short break</button></nav>
    <div id="clock" aria-live="off">25:00</div>
    <p id="status" aria-live="polite">Ready when you are</p>
    <button id="start">Start</button><button id="reset" class="secondary">Reset</button>
    <p class="count">Completed focus sessions: <strong id="count">0</strong></p>
  </section>
  <label class="notify"><input type="checkbox" id="notify"> Enable end-of-session browser notification</label>
  <footer>FocusNest · Simple tools for steady progress</footer>
</main>
<script src="app.js"></script>
</body></html>
